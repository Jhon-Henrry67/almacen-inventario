<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#bg)"/>
  <g transform="translate(100,100)">
    <!-- Cuerpo de la caja -->
    <rect x="-42" y="-20" width="84" height="56" rx="6" fill="url(#box)" stroke="#dee2e6" stroke-width="1.5"/>
    <!-- Tapa de la caja -->
    <path d="M-52,-20 L0,-50 L52,-20 Z" fill="#f1f3f5" stroke="#dee2e6" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Línea central de la cinta -->
    <rect x="-4" y="-50" width="8" height="76" rx="2" fill="#667eea" opacity="0.7"/>
    <!-- Nudo arriba -->
    <ellipse cx="0" cy="-50" rx="14" ry="8" fill="#667eea" opacity="0.85"/>
    <ellipse cx="0" cy="-50" rx="6" ry="4" fill="#5a67d8"/>
    <!-- Sombra suave -->
    <rect x="-42" y="36" width="84" height="6" rx="3" fill="#000" opacity="0.08"/>
  </g>
</svg>
