<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-41" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:0.6"/>
    </linearGradient>
    <pattern id="pat-41" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(77)">
      <rect width="20" height="20" fill="transparent"/>
      <circle cx="10" cy="10" r="1.5" fill="rgba(255,255,255,0.08)"/>
    </pattern>
    <filter id="shadow-41">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="400" height="300" fill="url(#bg-41)"/>
  <rect width="400" height="300" fill="url(#pat-41)"/>
  
  <!-- Borde decorativo -->
  <rect x="8" y="8" width="384" height="284" rx="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  
  <!-- Icono grande centrado -->
  <text x="200" y="120" font-size="60" text-anchor="middle" fill="rgba(255,255,255,0.12)">⚙️</text>
  
  <!-- Barra de categoría -->
  <rect x="0" y="0" width="400" height="40" fill="#1e88e5" opacity="0.9"/>
  <text x="20" y="27" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">RODAMIENTO</text>
  <text x="380" y="27" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="end">#041</text>
  
  <!-- Nombre del producto -->
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle" filter="url(#shadow-41)">Rodamiento de Bola 0950014-0…</text>
  
  <!-- SKU -->
  <rect x="122" y="195" width="156" height="28" rx="14" fill="rgba(0,0,0,0.4)"/>
  <text x="200" y="214" font-family="monospace" font-size="13" fill="#4fc3f7" text-anchor="middle" font-weight="bold">ROD-0950-041</text>
  
  <!-- Línea decorativa -->
  <line x1="60" y2="245" x2="340" y2="245" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Footer -->
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" text-anchor="middle">Freebuff Almacén</text>
</svg>